# KIDORA — Nginx server block untuk kidora.com.my
# Letak di /etc/nginx/sites-available/kidora.com.my

server {
    listen 80;
    listen [::]:80;
    server_name kidora.com.my www.kidora.com.my;

    root /var/www/kidora/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Static assets (hashed filenames) — cache agresif
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API reverse proxy → Node backend (port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SPA fallback — semua route lain serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
